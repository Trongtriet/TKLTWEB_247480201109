<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var n = Number(prompt("Nhập số n:"));
        var x = 1;
    
        while (x <= n) {
            document.write(x + "<br>");
            x++;
        }
    </script>
    
</body>
</html>
